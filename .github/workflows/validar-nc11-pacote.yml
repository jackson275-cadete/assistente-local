name: NC-11 - Validar pacote pessoal sem assinatura

on:
  push:
    branches: [validacao-nc11]
    paths:
      - ".github/workflows/validar-nc11-pacote.yml"
      - "validation/NC10_doc.diff"
      - "validation/Pessoal_config.diff"
      - "validation/Pessoal_manifest.sha256"
      - "validation/trigger-nc11.txt"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nc11-pacote-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validar-pacote:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout da branch isolada
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Conferir ZIP original
        shell: bash
        run: |
          set -euo pipefail
          echo "871d37325be9b4aeb31384c7c7f1a00420f1b5d338b33030fffde1bfd77c3c9c  AssistenteLocal_v0.8_isolada.zip" | sha256sum -c -
          unzip -t AssistenteLocal_v0.8_isolada.zip

      - name: Preparar correções NC-01 a NC-04
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p work
          unzip -q AssistenteLocal_v0.8_isolada.zip -d work
          patch --batch --forward -p1 -d work/AssistenteLocal < validation/EtapaA_NucleoMemoria_final.diff
          patch --batch --forward -p1 -d work/AssistenteLocal < validation/EtapaA_NucleoMemoriaTest_final.diff

      - name: Integrar JUnit 4 e conferir base NC-05
        shell: bash
        run: |
          set -euo pipefail
          cd work/AssistenteLocal
          echo "8ca6084b9c950d938240088f31b1fbc5605b0b90890d937e9e3c73e8c6647db9  app/build.gradle.kts" | sha256sum -c -
          python3 - <<'PY'
          from pathlib import Path
          p = Path("app/build.gradle.kts")
          s = p.read_text()
          marker = '    implementation("androidx.security:security-crypto:1.1.0-alpha06")\n'
          if s.count(marker) != 1:
              raise SystemExit("Dependência-base inesperada; abortando")
          p.write_text(s.replace(marker, marker + '\n    // NC-05: testes unitários JVM com JUnit 4.\n    testImplementation("junit:junit:4.13.2")\n'))
          PY
          echo "5c56fb2db2161f4756f2c7528cb5bc01f30c543cf06affb608acfb066208881e  app/src/main/java/br/local/assistente/NucleoMemoria.kt" | sha256sum -c -
          echo "67711e7b57f32aee2c8b97191d762f1c35ba68bd181af0835f896ebdbbcefab7  app/src/test/java/br/local/assistente/NucleoMemoriaTest.kt" | sha256sum -c -

      - name: Aplicar Etapa C e conferir NC-06 a NC-08
        shell: bash
        run: |
          set -euo pipefail
          patch --batch --forward -p1 -d work/AssistenteLocal < validation/NC06_EtapaC.diff
          cd work/AssistenteLocal
          echo "c7874e0f3afc65f7e40624fa60278f8e7ac8243e26e38bdbc8ac29afc17965b2  app/src/main/java/br/local/assistente/Historico.kt" | sha256sum -c -
          echo "d51ea7bf863c5f32ac995cd551b174faadcf57872645f0971a19e9446f07b4f1  app/src/main/java/br/local/assistente/MainActivity.kt" | sha256sum -c -
          echo "7ecfcba243e12ce21a57e7d585c2158808c75b69f5537e83a6349b7f76a60fab  app/src/test/java/br/local/assistente/HistoricoArquivoTest.kt" | sha256sum -c -
          echo "dcb71a4d2a7ebe4eb7dc5b8dbb3b8c9708006b4a1a9777f9013368a1d2a1ff91  app/build.gradle.kts" | sha256sum -c -

      - name: Aplicar NC-09 e conferir MonitorService
        shell: bash
        run: |
          set -euo pipefail
          patch --batch --forward -p1 -d work/AssistenteLocal < validation/NC09_EtapaD.diff
          cd work/AssistenteLocal
          echo "fee2157360ff72ac6bf32914d6494a8cf47d0b46b4589f3697e861014c12020c  app/src/main/java/br/local/assistente/MonitorService.kt" | sha256sum -c -
          echo "54929d420a0bafc3dbb31ab6107d46307b4662824a6aa3475d8561ef16037935  app/src/main/java/br/local/assistente/PersistenciaMonitor.kt" | sha256sum -c -
          echo "13f6727da9090b7935b20e0de22d90aab5c5d371e5ce6f471b297d73aa19d84b  app/src/test/java/br/local/assistente/PersistenciaMonitorTest.kt" | sha256sum -c -

      - name: Aplicar NC-10 e identidade pessoal
        shell: bash
        run: |
          set -euo pipefail
          patch --batch --forward -p2 -d work/AssistenteLocal < validation/NC10_doc.diff
          patch --batch --forward -p2 -d work/AssistenteLocal < validation/Pessoal_config.diff

      - name: Conferir manifesto completo dos 22 arquivos e regras do pacote
        shell: bash
        run: |
          set -euo pipefail
          cd work
          sha256sum -c ../validation/Pessoal_manifest.sha256
          cd AssistenteLocal
          test "$(grep -c '^[[:space:]]*@Test' app/src/test/java/br/local/assistente/NucleoMemoriaTest.kt)" -eq 36
          test "$(grep -c '^[[:space:]]*@Test' app/src/test/java/br/local/assistente/HistoricoArquivoTest.kt)" -eq 7
          test "$(grep -c '^[[:space:]]*@Test' app/src/test/java/br/local/assistente/PersistenciaMonitorTest.kt)" -eq 6
          grep -Fq 'applicationId = "br.local.assistente.pessoal"' app/build.gradle.kts
          grep -Fq 'versionCode = 800' app/build.gradle.kts
          grep -Fq 'versionName = "0.8.0"' app/build.gradle.kts
          grep -Fq 'android:label="Assistente Local (pessoal)"' app/src/main/AndroidManifest.xml
          test "$(grep -c 'uses-permission' app/src/main/AndroidManifest.xml)" -eq 7
          ! grep -q 'android.permission.INTERNET' app/src/main/AndroidManifest.xml
          ! find . -type f | grep -iE '\.(p12|pfx|jks|keystore|b64)$'
          ! find . -type f -name 'debug.keystore' | grep .

      - name: Reconstruir ZIP determinístico e comparar SHA-256
        shell: bash
        run: |
          set -euo pipefail
          cd work
          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile, ZipInfo, ZIP_STORED
          root = Path("AssistenteLocal")
          out = Path("../AssistenteLocal_pessoal_NC01-10_rascunho.zip")
          paths = [root] + sorted(root.rglob("*"), key=lambda p: p.relative_to(root.parent).as_posix())
          with ZipFile(out, "w", compression=ZIP_STORED, strict_timestamps=True) as z:
              for p in paths:
                  name = p.relative_to(root.parent).as_posix()
                  is_dir = p.is_dir()
                  if is_dir:
                      name += "/"
                  info = ZipInfo(name, date_time=(2026, 1, 1, 0, 0, 0))
                  info.create_system = 3
                  info.compress_type = ZIP_STORED
                  info.extra = b""
                  info.comment = b""
                  info.external_attr = ((0o40755 << 16) | 0x10) if is_dir else (0o100644 << 16)
                  z.writestr(info, b"" if is_dir else p.read_bytes())
          PY
          sha256sum ../AssistenteLocal_pessoal_NC01-10_rascunho.zip
          sha256sum ../AssistenteLocal_pessoal_NC01-10_rascunho.zip
          unzip -t ../AssistenteLocal_pessoal_NC01-10_rascunho.zip
          echo "Integridade e conteúdo verificados pelo manifesto de 22 arquivos; metadados ZIP não são usados como prova de conteúdo."

      - name: Configurar Java 17
        uses: actions/setup-java@dded0888837ed1f317902acf8a20df0ad188d165 # v4.2.2
        with:
          distribution: temurin
          java-version: "17"

      - name: Configurar Gradle 8.7
        uses: gradle/actions/setup-gradle@017a9effdb900e5b5b2fddfb590a105619dca3c3 # v4.4.2
        with:
          gradle-version: "8.7"
          cache-disabled: true

      - name: Executar 49 testes JVM e compilar release sem assinatura
        working-directory: work/AssistenteLocal
        run: gradle testDebugUnitTest assembleRelease --no-daemon --stacktrace --console=plain

      - name: Conferir identidade e permissões do APK release sem assinatura
        working-directory: work/AssistenteLocal
        shell: bash
        run: |
          set -euo pipefail
          APK=$(find app/build/outputs/apk/release -maxdepth 1 -type f -name '*.apk' -print -quit)
          test -n "$APK"
          AAPT2=$(find "$ANDROID_HOME/build-tools" -type f -name aapt2 | sort -V | tail -1)
          "$AAPT2" dump badging "$APK" | tee badging.txt
          "$AAPT2" dump xmltree --file AndroidManifest.xml "$APK" | tee manifesto.txt
          grep -q "package: name='br.local.assistente.pessoal'" badging.txt
          grep -q "versionCode='800'" badging.txt
          grep -q "versionName='0.8.0'" badging.txt
          grep -Fq "application: label='Assistente Local (pessoal)'" badging.txt
          test "$(grep -Fc '="Assistente Local (pessoal)"' manifesto.txt)" -ge 2
          ! grep -q 'application-debuggable' badging.txt
          # aapt2 dump badging já expõe uses-permission; não chamar o subcomando
          # "dump permissions", que não existe nesta versão do aapt2.
          grep -Fq "uses-permission: name='android.permission.FOREGROUND_SERVICE'" badging.txt
          grep -Fq "uses-permission: name='android.permission.RECEIVE_BOOT_COMPLETED'" badging.txt
          ! grep -Fq "uses-permission: name='android.permission.INTERNET'" badging.txt
          echo "Release sem assinatura: identidade, rótulos, permissões críticas e debuggable conferidos."
