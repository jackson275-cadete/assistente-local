name: APK temporario isolado - Assistente Local

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: apk-temporario-isolado
  cancel-in-progress: false

jobs:
  build:
    name: Validar e gerar APK debug temporário
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout da fonte aprovada
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: assinatura-nc11

      - name: Conferir ZIP-base
        shell: bash
        run: |
          set -euo pipefail
          test -s AssistenteLocal_v0.8_isolada.zip
          unzip -t AssistenteLocal_v0.8_isolada.zip

      - name: Reconstruir correções NC-01 a NC-04
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p work
          unzip -q AssistenteLocal_v0.8_isolada.zip -d work
          patch --batch --forward -p1 -d work/AssistenteLocal < validation/EtapaA_NucleoMemoria_final.diff
          patch --batch --forward -p1 -d work/AssistenteLocal < validation/EtapaA_NucleoMemoriaTest_final.diff

      - name: Integrar JUnit 4 e aplicar NC-05
        shell: bash
        run: |
          set -euo pipefail
          cd work/AssistenteLocal
          echo "8ca6084b9c950d938240088f31b1fbc5605b0b90890d937e9e3c73e8c6647db9  app/build.gradle.kts" | sha256sum -c -
          python3 - <<'PY'
          from pathlib import Path
          p=Path("app/build.gradle.kts")
          s=p.read_text()
          marker='    implementation("androidx.security:security-crypto:1.1.0-alpha06")\n'
          if s.count(marker)!=1: raise SystemExit("Dependência-base inesperada")
          p.write_text(s.replace(marker,marker+'\n    // NC-05: testes unitários JVM com JUnit 4.\n    testImplementation("junit:junit:4.13.2")\n'))
          PY

      - name: Aplicar NC-06 a NC-08
        shell: bash
        run: |
          set -euo pipefail
          patch --batch --forward -p1 -d work/AssistenteLocal < validation/NC06_EtapaC.diff

      - name: Aplicar NC-09, NC-10 e identidade pessoal
        shell: bash
        run: |
          set -euo pipefail
          patch --batch --forward -p1 -d work/AssistenteLocal < validation/NC09_EtapaD.diff
          patch --batch --forward -p2 -d work/AssistenteLocal < validation/NC10_doc.diff
          patch --batch --forward -p2 -d work/AssistenteLocal < validation/Pessoal_config.diff
          find work -type f -name '*.orig' -delete
          find work -type f -name '*.rej' -delete

      - name: Isolar identidade do APK temporário
        working-directory: work/AssistenteLocal
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path("app/build.gradle.kts")
          s=p.read_text()
          marker='    buildTypes {\n'
          if s.count(marker)!=1: raise SystemExit("Bloco buildTypes inesperado")
          s=s.replace(marker, marker+'        debug {\n            applicationIdSuffix = ".temporario"\n            versionNameSuffix = "-temporario"\n        }\n')
          p.write_text(s)
          m=Path("app/src/main/AndroidManifest.xml")
          t=m.read_text()
          if t.count('Assistente Local (pessoal)') != 2:
              raise SystemExit("Labels pessoais inesperadas no Manifest")
          m.write_text(t.replace('Assistente Local (pessoal)','Assistente Local (APK temporário)'))
          PY
          grep -Fq 'applicationIdSuffix = ".temporario"' app/build.gradle.kts
          grep -Fq 'versionNameSuffix = "-temporario"' app/build.gradle.kts
          ! grep -Fq 'Assistente Local (pessoal)' app/src/main/AndroidManifest.xml

      - name: Configurar Java 17
        uses: actions/setup-java@dded0888837ed1f317902acf8a20df0ad188d165 # v4.2.2
        with:
          distribution: temurin
          java-version: "17"

      - name: Configurar Gradle 8.7
        uses: gradle/actions/setup-gradle@017a9effdb900e5b5b2fddfb590a105619dca3c3 # v4.4.2
        with:
          gradle-version: "8.7"
          cache-disabled: true

      - name: Executar 49 testes e compilar APK debug temporário
        working-directory: work/AssistenteLocal
        run: gradle testDebugUnitTest assembleDebug --no-daemon --stacktrace --console=plain

      - name: Conferir pacote, versão, rótulo e assinatura debug
        working-directory: work/AssistenteLocal
        shell: bash
        run: |
          set -euo pipefail
          APK=$(find app/build/outputs/apk/debug -maxdepth 1 -type f -name '*.apk' -print -quit)
          test -n "$APK"
          BUILD_TOOLS=$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)
          "$BUILD_TOOLS/aapt2" dump badging "$APK" | tee badging.txt
          grep -q "package: name='br.local.assistente.pessoal.temporario'" badging.txt
          grep -q "versionCode='800'" badging.txt
          grep -q "versionName='0.8.0-temporario'" badging.txt
          grep -Fq "application: label='Assistente Local (APK temporário)'" badging.txt
          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs "$APK" | tee assinatura.txt
          grep -q 'Verifies' assinatura.txt
          echo "APK temporário isolado validado. Chave debug efêmera do runner; não é assinatura permanente."

      - name: Publicar APK temporário
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: AssistenteLocal-APK-temporario-isolado
          path: work/AssistenteLocal/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7
